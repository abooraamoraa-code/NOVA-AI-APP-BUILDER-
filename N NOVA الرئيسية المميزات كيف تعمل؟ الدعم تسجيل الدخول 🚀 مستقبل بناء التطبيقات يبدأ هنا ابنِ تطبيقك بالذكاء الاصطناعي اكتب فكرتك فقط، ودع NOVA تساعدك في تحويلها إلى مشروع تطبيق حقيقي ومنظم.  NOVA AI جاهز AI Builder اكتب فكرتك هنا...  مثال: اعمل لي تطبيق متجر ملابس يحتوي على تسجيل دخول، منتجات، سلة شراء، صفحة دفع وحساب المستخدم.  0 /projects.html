<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA - مشاريعي</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #080b16;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(1000px, calc(100% - 30px));
            margin: auto;
            padding: 50px 0;
        }

        h1 {
            font-size: 38px;
        }

        .box {
            margin-top: 25px;
            padding: 30px;
            border-radius: 20px;
            background: #121827;
            border: 1px solid #293149;
        }

        .success {
            color: #4ade80;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            margin-top: 25px;
            padding: 13px 20px;
            border: 0;
            border-radius: 10px;
            background: #6366f1;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>
            مشاريعي 🚀
        </h1>

        <div class="box">

            <div class="success">
                ✅ صفحة المشاريع تعمل!
            </div>

            <p>
                إذا رأيت هذه الرسالة، فإن GitHub Pages
                يقرأ ملف projects.html بشكل صحيح.
            </p>

            <p>
                الخطوة التالية ستكون إعادة ربط Supabase
                والبيانات الحقيقية بطريقة منظمة.
            </p>

            <button
                onclick="location.href='index.html'">
                العودة للرئيسية
            </button>

        </div>

    </main>

</body>

</html>
