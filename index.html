<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA — أنشئ تطبيقك بالذكاء الاصطناعي</title>

  <meta
    name="description"
    content="NOVA منصة لإنشاء التطبيقات والمواقع من وصف نصي باستخدام الذكاء الاصطناعي."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --nova-bg: #070b14;
      --nova-bg-2: #0b1220;
      --nova-card: rgba(18, 27, 44, 0.78);
      --nova-card-2: rgba(25, 36, 57, 0.72);
      --nova-border: rgba(255, 255, 255, 0.10);
      --nova-text: #f5f7fb;
      --nova-muted: #9da9bc;
      --nova-primary: #6d5dfc;
      --nova-primary-2: #8a7dff;
      --nova-blue: #4285f4;
      --nova-green: #34a853;
      --nova-yellow: #fbbc05;
      --nova-red: #ea4335;
      --nova-github: #f0f0f0;
      --nova-radius: 20px;
      --nova-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
      color: var(--nova-text);
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(66, 133, 244, 0.14),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 15%,
          rgba(109, 93, 252, 0.18),
          transparent 30%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(52, 168, 83, 0.08),
          transparent 35%
        ),
        var(--nova-bg);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.025) 1px,
          transparent 1px
        );
      background-size: 45px 45px;
      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 90%
      );
      z-index: -1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1200px, calc(100% - 40px));
      margin: auto;
    }

    /* ================================
       HEADER
    ================================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--nova-border);
      background: rgba(7, 11, 20, 0.72);
      backdrop-filter: blur(18px);
    }

    .header-inner {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: max-content;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 20px;
      color: white;
      background:
        linear-gradient(
          135deg,
          var(--nova-blue),
          var(--nova-primary),
          #a85cff
        );
      box-shadow:
        0 8px 30px rgba(109, 93, 252, 0.35);
    }

    .brand-name {
      font-size: 21px;
      font-weight: 850;
      letter-spacing: 0.3px;
    }

    .brand-name span {
      color: var(--nova-primary-2);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .nav-link {
      color: var(--nova-muted);
      padding: 10px 14px;
      border-radius: 10px;
      transition: 0.2s ease;
      font-size: 14px;
    }

    .nav-link:hover {
      color: white;
      background: rgba(255,255,255,0.06);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 11px;
      padding: 11px 17px;
      color: white;
      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.055);
      border-color: var(--nova-border);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.09);
    }

    .btn-primary {
      background:
        linear-gradient(
          135deg,
          var(--nova-primary),
          #5141db
        );
      box-shadow:
        0 10px 30px rgba(109, 93, 252, 0.25);
    }

    .btn-primary:hover {
      box-shadow:
        0 15px 38px rgba(109, 93, 252, 0.38);
    }

    /* ================================
       HERO
    ================================= */

    .hero {
      padding: 95px 0 70px;
      position: relative;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 55px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border: 1px solid var(--nova-border);
      border-radius: 999px;
      color: #cbd4e3;
      background: rgba(255,255,255,0.045);
      font-size: 13px;
      margin-bottom: 22px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #36d399;
      box-shadow: 0 0 14px rgba(54,211,153,0.8);
    }

    .hero-title {
      font-size: clamp(42px, 6vw, 76px);
      line-height: 1.04;
      letter-spacing: -2.5px;
      font-weight: 950;
      margin-bottom: 24px;
    }

    .hero-title .gradient {
      background:
        linear-gradient(
          90deg,
          #ffffff,
          #9f95ff,
          #5d8cff
        );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-description {
      max-width: 680px;
      color: var(--nova-muted);
      line-height: 1.9;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }

    .hero-note {
      color: #758198;
      font-size: 13px;
    }

    /* ================================
       BUILDER CARD
    ================================= */

    .builder-card {
      position: relative;
      padding: 18px;
      border-radius: 27px;
      border: 1px solid var(--nova-border);
      background:
        linear-gradient(
          145deg,
          rgba(26, 37, 59, 0.94),
          rgba(11, 17, 29, 0.94)
        );
      box-shadow: var(--nova-shadow);
    }

      height: 40px;
      display: flex;
      align
