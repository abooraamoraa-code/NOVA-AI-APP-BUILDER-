<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مشاريعي - NOVA</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================================
           NOVA PROJECTS DASHBOARD
        ========================================= */

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(124, 58, 237, 0.16),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(37, 99, 235, 0.12),
                    transparent 35%
                ),
                #070b16;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        .nova-dashboard {
            min-height: 100vh;
        }

        /* HEADER */

        .dashboard-header {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(7,11,22,0.92);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nova-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: bold;
        }

        .nova-logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            box-shadow: 0 10px 30px rgba(124,58,237,0.35);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-email {
            color: #aeb7ca;
            font-size: 14px;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-button {
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .header-button:hover {
            background: rgba(255,255,255,0.09);
        }

        .logout-button {
            color: #ff8f8f;
        }

        /* MAIN */

        .dashboard-main {
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;
            padding: 45px 0 70px;
        }

        .welcome-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .welcome-title {
            margin: 0 0 10px;
            font-size: 38px;
        }

        .welcome-description {
            margin: 0;
            color: #9da8bd;
            font-size: 16px;
        }

        .new-project-button {
            border: 0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 14px 22px;
            border-radius: 13px;
            cursor: pointer;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            box-shadow: 0 12px 35px rgba(67,56,202,0.3);
            transition: 0.2s;
        }

        .new-project-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(67,56,202,0.4);
        }

        /* STATS */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 40px;
        }

        .stat-card {
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            background: rgba(255,255,255,0.035);
        }

        .stat-label {
            color: #9da8bd;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 30px;
            font-weight: bold;
        }

        /* PROJECT HEADER */

        .projects-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .projects-heading h2 {
            margin: 0;
            font-size: 25px;
        }

        .refresh-button {
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: white;
            border-radius: 10px;
            padding: 9px 14px;
            cursor: pointer;
        }

        /* PROJECT GRID */

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .project-card {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.055),
                    rgba(255,255,255,0.018)
                );
            padding: 22px;
            min-height: 210px;
            transition: 0.25s;
        }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: rgba(124,58,237,0.45);
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .project-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(124,58,237,0.15);
            font-size: 22px;
            margin-bottom: 18px;
        }

        .project-name {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .project-description {
            margin: 0 0 18px;
            color: #9da8bd;
            font-size: 14px;
            line-height: 1.7;
            min-height: 48px;
        }

        .project-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
        }

        .project-status {
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 20px;
            background: rgba(34,197,94,0.12);
            color: #72e6a0;
        }

        .project-framework {
            color: #8f9ab0;
            font-size: 12px;
        }

        .project-actions {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }

        .project-action {
            flex: 1;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: white;
            border-radius: 9px;
            padding: 9px;
            cursor: pointer;
        }

        .project-action:hover {
            background: rgba(255,255,255,0.09);
        }

        .delete-project {
            color: #ff8888;
        }

        /* EMPTY */

        .empty-state {
            grid-column: 1 / -1;
            padding: 70px 25px;
            text-align: center;
            border: 1px dashed rgba(255,255,255,0.12);
            border-radius: 22px;
            background: rgba(255,255,255,0.02);
        }

        .empty-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        .empty-state p {
            color: #9da8bd;
            margin-bottom: 22px;
        }

        /* LOADING */

        .loading-state {
            grid-column: 1 / -1;
            padding: 70px;
            text-align: center;
            color: #aeb7ca;
        }

        .loading-spinner {
            width: 42px;
            height: 42px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #7c3aed;
            border-radius: 50%;
            margin: 0 auto 18px;
            animation: novaSpin 0.8s linear infinite;
        }

        @keyframes novaSpin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ERROR */

        .error-state {
            grid-column: 1 / -1;
            padding: 35px;
            text-align: center;
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 18px;
            background: rgba(239,68,68,0.06);
        }

        .error-state h3 {
            color: #ff9292;
            margin-top: 0;
        }

        .error-state p {
            color: #b9a5a5;
            line-height: 1.7;
        }

        /* TOAST */

        .nova-toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: #111827;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 13px 20px;
            border-radius: 12px;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
            z-index: 9999;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .nova-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* MOBILE */

        @media (max-width: 900px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .dashboard-header {
                padding: 0 15px;
            }

            .user-email {
                display: none;
            }

            .dashboard-main {
                width: min(100% - 24px, 1200px);
                padding-top: 30px;
            }

            .welcome-section {
                flex-direction: column;
                align-items: stretch;
            }

            .welcome-title {
                font-size: 30px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="nova-dashboard">

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="dashboard-header">

        <div class="nova-logo">
            <div class="nova-logo-icon">
                ✦
            </div>

            <span>NOVA</span>
        </div>

        <div class="header-actions">

            <span
                id="userEmail"
                class="user-email">
                جاري التحميل...
            </span>

            <button
                id="homeButton"
                class="header-button">
                الرئيسية
            </button>

            <button
                id="logoutButton"
                class="header-button logout-button">
                تسجيل الخروج
            </button>

        </div>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="dashboard-main">

        <!-- WELCOME -->

        <section class="welcome-section">

            <div>

                <h1 class="welcome-title">
                    مشاريعي 🚀
                </h1>

                <p class="welcome-description">
                    أنشئ تطبيقاتك وأدر مشاريعك باستخدام NOVA AI.
                </p>

            </div>

            <button
                id="newProjectButton"
                class="new-project-button">
                ＋ مشروع جديد
            </button>

        </section>


        <!-- =====================================
             STATS
        ====================================== -->

        <section class="stats-grid">

            <div class="stat-card">

                <div class="stat-label">
                    إجمالي المشاريع
                </div>

                <div
                    id="totalProjects"
                    class="stat-value">
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    المشاريع النشطة
                </div>

                <div
                    id="activeProjects"
                    class="stat-value">
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    NOVA AI
                </div>

                <div class="stat-value">
                    جاهز ✨
                </div>

            </div>

        </section>


        <!-- =====================================
             PROJECTS HEADING
        ====================================== -->

        <section class="projects-heading">

            <h2>
                جميع مشاريعك
            </h2>

            <button
                id="refreshButton"
                class="refresh-button">
                ↻ تحديث
            </button>

        </section>


        <!-- =====================================
             PROJECTS
        ====================================== -->

        <section
            id="projectsGrid"
            class="projects-grid">

            <div class="loading-state">

                <div class="loading-spinner"></div>

                <div>
                    جاري تحميل المشاريع...
                </div>

            </div>

        </section>

    </main>

</div>


<!-- TOAST -->

<div
    id="novaToast"
    class="nova-toast">
</div>


<!-- =========================================
     SCRIPTS
========================================== -->

<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="database.js"></script>


<script>

    /* =========================================
       NOVA PROJECT DASHBOARD
    ========================================== */

    const projectsGrid =
        document.getElementById("projectsGrid");

    const totalProjects =
        document.getElementById("totalProjects");

    const activeProjects =
        document.getElementById("activeProjects");

    const userEmail =
        document.getElementById("userEmail");

    const newProjectButton =
        document.getElementById("newProjectButton");

    const logoutButton =
        document.getElementById("logoutButton");

    const homeButton =
        document.getElementById("homeButton");

    const refreshButton =
        document.getElementById("refreshButton");

    const novaToast =
        document.getElementById("novaToast");


    /* =========================================
       TOAST
    ========================================== */

    function showToast(message) {

        if (!novaToast) {
            return;
        }

        novaToast.textContent = message;

        novaToast.classList.add("show");

        setTimeout(function () {

            novaToast.classList.remove("show");

        }, 3000);
    }


    /* =========================================
       ESCAPE HTML
    ========================================== */

    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =========================================
       LOAD USER
    ========================================== */

    async function loadUser() {

        try {

            const user =
                await NOVA_AUTH.getUser();

            if (!user) {

                window.location.href = "login.html";

                return null;
            }

            userEmail.textContent =
                user.email || "مستخدم NOVA";

            return user;

        } catch (error) {

            console.error(
                "NOVA USER ERROR:",
                error
            );

            window.location.href = "login.html";

            return null;
        }
    }


    /* =========================================
       PROJECT ICON
    ========================================== */

    function getProjectIcon(project) {

        const framework =
            String(
                project.framework || ""
            ).toLowerCase();

        if (framework.includes("react")) {
            return "⚛️";
        }

        if (framework.includes("vue")) {
            return "💚";
        }

        if (framework.includes("next")) {
            return "▲";
        }

        if (framework.includes("mobile")) {
            return "📱";
        }

        if (framework.includes("game")) {
            return "🎮";
        }

        return "🚀";
    }


    /* =========================================
       PROJECT STATUS
    ========================================== */

    function getStatusText(status) {

        const value =
            String(status || "active")
                .toLowerCase();

        if (
            value === "completed" ||
            value === "complete"
        ) {
            return "مكتمل";
        }

        if (
            value === "draft"
        ) {
            return "مسودة";
        }

        if (
            value === "archived"
        ) {
            return "مؤرشف";
        }

        if (
            value === "building"
        ) {
            return "قيد الإنشاء";
        }

        return "نشط";
    }


    /* =========================================
       FORMAT DATE
    ========================================== */

    function formatDate(dateValue) {

        if (!dateValue) {
            return "بدون تاريخ";
        }

        try {

            const date =
                new Date(dateValue);

            return date.toLocaleDateString(
                "ar",
                {
                    year: "numeric",
                    month: "short",
                    day: "numeric"
                }
            );

        } catch (error) {

            return "بدون تاريخ";
        }
    }


    /* =========================================
       RENDER PROJECT
    ========================================== */

    function createProjectCard(project) {

        const card =
            document.createElement("article");

        card.className =
            "project-card";

        const name =
            escapeHTML(
                project.name ||
                "مشروع بدون اسم"
            );

        const description =
            escapeHTML(
                project.description ||
                "لا يوجد وصف لهذا المشروع."
            );

        const framework =
            escapeHTML(
                project.framework ||
                "NOVA"
            );

        const status =
            getStatusText(
                project.status
            );

        const icon =
            getProjectIcon(project);

        const updated =
            formatDate(
                project.updated_at ||
                project.created_at
            );

        card.innerHTML = `

            <div class="project-icon">
                ${icon}
            </div>

            <h3 class="project-name">
                ${name}
            </h3>

            <p class="project-description">
                ${description}
            </p>

            <div class="project-meta">

                <span class="project-status">
                    ${escapeHTML(status)}
                </span>

                <span class="project-framework">
                    ${framework}
                </span>

            </div>

            <div class="project-meta">

                <span class="project-framework">
                    آخر تحديث
                </span>

                <span class="project-framework">
                    ${escapeHTML(updated)}
                </span>

            </div>

            <div class="project-actions">

                <button
                    class="project-action open-project"
                    data-id="${escapeHTML(project.id)}">
                    فتح
                </button>

                <button
                    class="project-action delete-project"
                    data-id="${escapeHTML(project.id)}">
                    حذف
                </button>

            </div>
        `;

        return card;
    }


    /* =========================================
       EMPTY STATE
    ========================================== */

    function showEmptyState() {

        projectsGrid.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    🚀
                </div>

                <h3>
                    لا توجد مشاريع حتى الآن
                </h3>

                <p>
                    ابدأ أول مشروع لك مع NOVA AI
                    وأنشئ تطبيقك من وصف بسيط.
                </p>

                <button
                    class="new-project-button"
                    id="emptyNewProjectButton">
                    ＋ إنشاء أول مشروع
                </button>

            </div>
        `;

        const button =
            document.getElementById(
                "emptyNewProjectButton"
            );

        if (button) {

            button.addEventListener(
                "click",
                function () {

                    window.location.href =
                        "builder.html";

                }
            );
        }
    }


    /* =========================================
       ERROR STATE
    ========================================== */

    function showErrorState(error) {

        console.error(
            "NOVA PROJECT ERROR:",
            error
        );

        projectsGrid.innerHTML = `

            <div class="error-state">

                <h3>
                    حدث خطأ أثناء تحميل المشاريع
                </h3>

                <p>
                    تأكد من اتصال NOVA بقاعدة بيانات Supabase
                    ومن صلاحيات قاعدة البيانات.
                </p>

                <button
                    id="retryProjectsButton"
                    class="new-project-button">
                    إعادة المحاولة
                </button>

            </div>
        `;

        const retryButton =
            document.getElementById(
                "retryProjectsButton"
            );

        if (retryButton) {

            retryButton.addEventListener(
                "click",
                loadProjects
            );
        }
    }


    /* =========================================
       LOAD PROJECTS FROM SUPABASE
    ========================================== */

    async function loadProjects() {

        projectsGrid.innerHTML = `

            <div class="loading-state">

                <div class="loading-spinner"></div>

                <div>
                    جاري تحميل المشاريع...
                </div>

            </div>
        `;

        try {

            if (
                typeof NOVA_DB === "undefined"
            ) {

                throw new Error(
                    "NOVA_DB غير موجود. تأكد من تحميل database.js"
                );
            }


            const projects =
                await NOVA_DB.getProjects();


            console.log(
                "NOVA PROJECTS:",
                projects
            );


            if (
                !projects ||
                projects.length === 0
            ) {

                totalProjects.textContent =
                    "0";

                activeProjects.textContent =
                    "0";

                showEmptyState();

                return;
            }


            totalProjects.textContent =
                projects.length;


            const activeCount =
                projects.filter(
                    function (project) {

                        const status =
                            String(
                                project.status ||
                                "active"
                            ).toLowerCase();

                        return (
                            status !== "archived" &&
                            status !== "completed"
                        );
                    }
                ).length;


            activeProjects.textContent =
                activeCount;


            projectsGrid.innerHTML = "";


            projects.forEach(
                function (project) {

                    const card =
                        createProjectCard(
                            project
                        );

                    projectsGrid.appendChild(
                        card
                    );
                }
            );


            attachProjectEvents();


        } catch (error) {

            showErrorState(error);
        }
    }


    /* =========================================
       PROJECT EVENTS
    ========================================== */

    function attachProjectEvents() {

        const openButtons =
            document.querySelectorAll(
                ".open-project"
            );

        openButtons.forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        const projectId =
                            button.dataset.id;

                        if (!projectId) {
                            return;
                        }

                        /*
                         * builder.html سيتم ربطه
                         * بالمشروع في الخطوات القادمة.
                         */

                        window.location.href =
                            "builder.html?id=" +
                            encodeURIComponent(
                                projectId
                            );
                    }
                );
            }
        );


        const deleteButtons =
            document.querySelectorAll(
                ".delete-project"
            );


        deleteButtons.forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    async function () {

                        const projectId =
                            button.dataset.id;

                        if (!projectId) {
                            return;
                        }


                        const confirmed =
                            window.confirm(
                                "هل أنت متأكد أنك تريد حذف هذا المشروع؟"
                            );


                        if (!confirmed) {
                            return;
                        }


                        button.disabled =
                            true;

                        button.textContent =
                            "جاري الحذف...";


                        try {

                            await NOVA_DB.deleteProject(
                                projectId
                            );


                            showToast(
                                "تم حذف المشروع بنجاح"
                            );


                            await loadProjects();


                        } catch (error) {

                            console.error(
                                "DELETE PROJECT ERROR:",
                                error
                            );


                            showToast(
                                "حدث خطأ أثناء حذف المشروع"
                            );


                            button.disabled =
                                false;

                            button.textContent =
                                "حذف";
                        }

                    }
                );
            }
        );
    }


    /* =========================================
       NEW PROJECT
    ========================================== */

    newProjectButton.addEventListener(
        "click",
        function () {

            window.location.href =
                "builder.html";

        }
    );


    /* =========================================
       REFRESH
    ========================================== */

    refreshButton.addEventListener(
        "click",
        async function () {

            refreshButton.disabled =
                true;

            refreshButton.textContent =
                "جاري التحديث...";

            await loadProjects();

            refreshButton.disabled =
                false;

            refreshButton.textContent =
                "↻ تحديث";

        }
    );


    /* =========================================
       HOME
    ========================================== */

    homeButton.addEventListener(
        "click",
        function () {

            window.location.href =
                "index.html";

        }
    );


    /* =========================================
       LOGOUT
    ========================================== */

    logoutButton.addEventListener(
        "click",
        async function () {

            logoutButton.disabled =
                true;

            logoutButton.textContent =
                "جاري تسجيل الخروج...";


            try {

                await NOVA_AUTH.logout();

                window.location.href =
                    "index.html";

            } catch (error) {

                console.error(
                    "LOGOUT ERROR:",
                    error
                );

                logoutButton.disabled =
                    false;

                logoutButton.textContent =
                    "تسجيل الخروج";

                showToast(
                    "حدث خطأ أثناء تسجيل الخروج"
                );
            }
        }
    );


    /* =========================================
       START NOVA DASHBOARD
    ========================================== */

    async function startDashboard() {

        try {

            const user =
                await loadUser();


            if (!user) {
                return;
            }


            await loadProjects();


        } catch (error) {

            console.error(
                "NOVA DASHBOARD ERROR:",
                error
            );

            showErrorState(error);
        }
    }


    /* =========================================
       AUTH STATE
    ========================================== */

    if (
        typeof NOVA_AUTH !== "undefined" &&
        typeof NOVA_AUTH.onAuthChange === "function"
    ) {

        NOVA_AUTH.onAuthChange(
            function (event, session) {

                if (!session) {

                    window.location.href =
                        "login.html";

                }

            }
        );
    }


    /* =========================================
       WAIT FOR SUPABASE
    ========================================== */

    if (
        typeof NOVA_SUPABASE !== "undefined"
    ) {

        startDashboard();

    } else {

        window.addEventListener(
            "nova:supabase-ready",
            startDashboard,
            {
                once: true
            }
        );

    }

</script>

</body>
</html>
