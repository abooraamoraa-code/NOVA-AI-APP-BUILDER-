           NOVA PROJECTS PAGE

        .projects-page {
            min-height: 100vh;
            background:

                    circle at top right,
                    rgba(99, 102, 241, 0.12),
                    transparent 35%
                ),
                #080b16;
        }

        .projects-main {
            width: min(1200px, calc(100% - 40px));
            margin: 0 auto;
            padding: 55px 0 80px;
        }

            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 40px;
        }

        .projects-title-area h1 {
            margin: 0 0 10px;
            color: #fff;
            font-size: 34px;
        }

        .projects-title-area p {
            margin: 0;
            color: #9ca3b5;
            font-size: 16px;
        }

        .projects-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

            border-radius: 12px;

            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

            color: #fff;
            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #4f46e5
                );
        }
